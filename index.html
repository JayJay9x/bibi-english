<title>Bibi English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen phone app. Sticky header with stars, scrolling stage in the middle, big thumb-reach tab bar at the bottom. */
:root{
  --bg:#FFF3F8; --card:#FFFFFF; --ink:#3B2352; --soft:#7B6690;
  --pink:#FF6FA5; --pink-deep:#E14587; --mint:#3CCFB0; --sun:#FFD23F; --sky:#7CC6FE; --grape:#9B6BDF;
  --line:#F3D9E6; --ok:#2FB98F; --bad:#FF7A7A;
  --display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bg);box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;font-size:17px;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:8px;padding-block:10px 8px}
header h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1;color:var(--pink-deep);flex:1;min-width:0}
header h1 span{color:var(--grape)}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:800;font-size:16px;color:var(--ink);font-family:var(--body);font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:6px 20px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;background:var(--card);border-top:2px solid var(--line);padding-block:6px}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:800;color:var(--soft);padding:4px 0;border-radius:14px}
nav button i{font-style:normal;font-size:26px;line-height:1.1;filter:grayscale(.7);transition:transform .2s}
nav button.on{color:var(--pink-deep)}
nav button.on i{filter:none;transform:translateY(-3px) scale(1.15)}
h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--soft);font-size:15px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.back{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;font-size:15px}
.btn{background:var(--pink);color:#fff;border:0;border-radius:18px;padding:13px 20px;font-weight:800;font-size:18px;box-shadow:0 5px 0 var(--pink-deep);font-family:var(--display)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-deep)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #25a488}
.btn.big{font-size:22px;padding:16px 26px}
/* hero */
.hero{display:flex;align-items:flex-end;gap:6px}
.hero .masc{width:128px;flex:none;cursor:pointer}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:12px 14px;flex:1;min-width:0;margin-bottom:26px}
.bubble::after{content:"";position:absolute;left:-13px;bottom:14px;width:20px;height:20px;background:var(--card);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble b{font-family:var(--display);font-size:20px;line-height:1.2;display:block}
.bubble small{color:var(--soft);font-size:14px;display:block;margin-top:2px}
.masc svg{width:100%;height:auto;display:block}
.bob{animation:bob 2.4s ease-in-out infinite}
.jump{animation:jump .6s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes jump{30%{transform:translateY(-26px) rotate(8deg)}60%{transform:translateY(0) rotate(-6deg)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.tile{border:0;border-radius:24px;padding:14px 10px;text-align:center;color:var(--ink);box-shadow:0 5px 0 rgba(59,35,82,.14);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(59,35,82,.14)}
.tile .em{font-size:44px;line-height:1.1}
.tile b{font-family:var(--display);font-size:19px;line-height:1.1}
.tile small{font-size:13px;color:var(--ink);opacity:.75}
.tile .bar{width:80%;height:7px;background:rgba(255,255,255,.7);border-radius:9px;margin-top:5px;overflow:hidden}
.tile .bar u{display:block;height:100%;background:var(--ink);border-radius:9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--soft)}
/* pictures */
.pic{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;line-height:1;vertical-align:middle}
.pic.sw{border-radius:32%;border:.05em solid var(--ink);box-shadow:inset -.1em -.12em 0 rgba(0,0,0,.12)}
.pic.num{font-family:var(--display);font-weight:800;color:var(--pink-deep)}

let Q=null;

function qRound(){if(Q.i>=Q.rounds.length)return finish(Q.score,Q.rounds.length);
  const w=Q.rounds[Q.i],P=getPool();Q.w=w;Q.first=true;Q.lock=false;
  Q.opts=shuffle([w].concat(shuffle(P.filter(x=>x.en!==w.en)).slice(0,3)));

   ?`<div class="prompt"><button class="round xl" data-act="qHear" aria-label="Nghe lại">🔊</button><b>Nghe và chọn hình đúng</b></div>`
   :`<div class="prompt">${pic(w)}<b>What is this? · Đây là gì?</b></div>`)
   +`<div class="grid">${Q.opts.map((o,k)=>`<button class="opt" data-act="qPick" data-arg="${k}">${Q.mode==='listen'?pic(o):o.en}</button>`).join('')}</div><p class="sub heard" id="qMsg"></p>`;
  if(Q.mode==='listen')say(w.en);}
A.qHear=()=>say(Q.w.en,.7);

  if(o.en===Q.w.en){Q.lock=true;b.classList.add('ok');sfx.ok();if(Q.first)Q.score++;addStars(1);say(Q.w.en);$('qMsg').textContent=`✅ ${Q.w.en} = ${Q.w.vi}`;Q.i++;timer=setTimeout(qRound,1300);}

  stage.innerHTML=gbar(0,6)+`<p class="sub">Tìm cặp hình và từ giống nhau · Match picture and word</p><div class="mem">${M.cards.map((c,i)=>`<button class="mc${c.k==='t'?' txt':''}" data-act="mFlip" data-arg="${i}" aria-label="Thẻ ${i+1}">?</button>`).join('')}</div>`;}

    stage.querySelector('.prog u').style.width=M.done/6*100+'%';stage.querySelector('.row b').textContent=M.done+'/6';

let SP=null;
function spell(){let ws=getPool().filter(w=>/^[a-z]{3,8}$/.test(w.en));SP={i:0,rounds:shuffle(ws).slice(0,6)};spRound();}
function spRound(){if(SP.i>=SP.rounds.length)return finish(0,0);const w=SP.rounds[SP.i];SP.w=w;SP.pos=0;
  let L=shuffle(w.en.split(''));if(L.join('')===w.en)L.reverse();

let srOK=!!SR,rec=null,spSet='phrases',si=0;
function stopRec(){try{if(rec)rec.abort();}catch(e){}rec=null;}
const spList=()=>spSet==='phrases'?PHRASES.map(p=>({en:p[0],vi:p[1]})):topic(spSet).words;
function speak(){const L=spList();if(si>=L.length)si=0;const it=L[si];
  stage.innerHTML=head('Nói theo tớ nào!','Nghe, rồi nói to và rõ. Nói tốt được 2 ⭐')+`<div class="pills"><button class="pill${spSet==='phrases'?' on':''}" data-act="spSet" data-arg="phrases">💬 Mẫu câu</button>${TOPICS.map(t=>`<button class="pill${spSet===t.id?' on':''}" data-act="spSet" data-arg="${t.id}">${t.em} ${t.en}</button>`).join('')}</div>
  <div class="prompt">${it.p?pic(it):`<div class="masc bob" style="width:110px">${mascot(Object.keys(CAST)[si%8])}</div>`}<div class="word" style="font-size:${it.en.length>14?28:38}px">${it.en}</div><div class="vi">${it.vi}</div></div>
  <div class="ctrl"><button class="round sky" data-act="spPrev" aria-label="Câu trước">◀</button><button class="round" data-act="spListen" aria-label="Nghe">🔊</button>${srOK?'<button class="round xl" id="mic" data-act="mic" aria-label="Bấm rồi nói">🎤</button>':''}<button class="round sky" data-act="spNext" aria-label="Câu tiếp">▶</button></div>
  <div class="heard" id="heard">${srOK?'Bấm 🎤 rồi nói nhé!':'Bấm 🔊 để nghe, nói theo thật to, rồi tự chấm điểm:'}</div>
  ${srOK?'':'<div class="ctrl"><button class="btn mint" data-act="selfOK">✅ Tớ nói được rồi!</button><button class="btn alt" data-act="spListen">Nghe lại</button></div>'}
  <p class="sub" style="text-align:center">${si+1} / ${L.length}</p>`;}
A.spSet=s=>{spSet=s;si=0;speak();say(spList()[0].en);};
A.spPrev=()=>{const n=spList().length;si=(si-1+n)%n;speak();say(spList()[si].en);};
A.spNext=()=>{si=(si+1)%spList().length;speak();say(spList()[si].en);};
A.spListen=()=>say(spList()[si].en,.7);
A.selfOK=()=>{sfx.ok();addStars(1);confetti(['🎤','⭐']);toast('Tuyệt vời! +1 ⭐');timer=setTimeout(A.spNext,900);};
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
A.mic=()=>{const target=norm(spList()[si].en),h=$('heard'),mic=$('mic');stopRec();try{speechSynthesis.cancel();}catch(e){}
  try{rec=new SR();rec.lang='en-US';rec.maxAlternatives=5;rec.interimResults=false;let got=false;
   rec.onstart=()=>{mic.classList.add('rec');h.textContent='👂 Tớ đang nghe… nói đi nào!';};
   rec.onresult=e=>{got=true;const alts=[].map.call(e.results[0],a=>norm(a.transcript));const tw=target.split(' ');
     const ok=alts.some(a=>{const aw=a.split(' ');return tw.filter(x=>aw.includes(x)).length/tw.length>=.6;});
     if(ok){sfx.win();addStars(2);confetti(['🎤','⭐','💖']);h.innerHTML='🌟 <b>Perfect! Nói hay quá!</b> +2 ⭐';timer=setTimeout(A.spNext,1600);}
     else{sfx.bad();h.innerHTML=`Tớ nghe thấy: "<b>${alts[0]||'…'}</b>". Bấm 🔊 nghe lại rồi thử lần nữa nhé!`;}};
   rec.onerror=e=>{if(e.error==='no-speech'){h.textContent='Tớ chưa nghe thấy gì. Nói to hơn nhé!';return;}got=true;srOK=false;speak();};
   rec.onend=()=>{const m=$('mic');if(m)m.classList.remove('rec');if(!got&&$('heard')&&/đang nghe/.test($('heard').textContent))$('heard').textContent='Tớ chưa nghe rõ. Bấm 🎤 thử lại nhé!';};
   rec.start();}catch(e){srOK=false;speak();}};

/* ---------- STORIES ---------- */
let st=null,pi=0;
function storyMenu(){stage.innerHTML=head('Truyện vui','Chạm vào tranh để nghe đọc. Đọc hết truyện được 3 ⭐')+STORIES.map((s,i)=>`<button class="story" data-act="story" data-arg="${i}"><span class="masc">${mascot(s.m)}</span><span><b>${s.t}</b><small>${s.v} ${S.stories[i]?'· ✅ đã đọc':''}</small></span></button>`).join('')+`<div><h2>Mẫu câu hay dùng</h2><p class="sub">Chạm để nghe</p></div><div class="grid">${PHRASES.map((p,i)=>`<button class="opt" style="font-size:17px" data-act="phrase" data-arg="${i}">${p[0]}<br><small class="sub" style="font-family:var(--body)">${p[1]}</small></button>`).join('')}</div>`;}
A.phrase=i=>say(PHRASES[i][0],.75);
A.story=i=>{st=+i;pi=0;panel();};
function panel(){const s=STORIES[st],p=s.p[pi],last=pi===s.p.length-1;
  stage.innerHTML=`<div class="row"><button class="back" data-act="go" data-arg="story">← Truyện</button><b>${s.t}</b></div>
  <div class="scene" data-act="pHear"><div class="cast"><div class="masc bob">${mascot(p[0],p[1])}</div><div class="prop">${p[2]}</div></div><div class="en">${p[3]}</div><div class="vn">${p[4]}</div></div>
  <div class="dots">${s.p.map((x,i)=>`<i class="${i===pi?'c':i<pi?'d':''}"></i>`).join('')}</div>
  <div class="ctrl"><button class="round sky" data-act="pPrev" aria-label="Trang trước">◀</button><button class="round xl" data-act="pHear" aria-label="Nghe">🔊</button><button class="round sky" data-act="pNext" aria-label="${last?'Kết thúc':'Trang tiếp'}">${last?'🏁':'▶'}</button></div>`;say(p[3],.78);stage.scrollTop=0;}
A.pHear=()=>say(STORIES[st].p[pi][3],.72);
A.pPrev=()=>{if(pi>0){pi--;panel();}};
A.pNext=()=>{const s=STORIES[st];if(pi<s.p.length-1){pi++;panel();return;}
  const first=!S.stories[st];S.stories[st]=1;save();if(first)addStars(3);sfx.win();confetti();
  stage.innerHTML=`<div class="center"><div class="masc jump">${mascot(s.m,'happy')}</div><h2>The End! Hết truyện!</h2><p class="sub">${first?'Con được thưởng 3 ⭐':'Con đã đọc truyện này rồi. Đọc lại vẫn giỏi lắm!'}</p><button class="btn big" data-act="go" data-arg="story">📖 Truyện khác</button></div>`;say('The end!');};

/* ---------- STICKERS ---------- */
function stickers(){const n=nStick();stage.innerHTML=head('Sổ sticker của tớ',`Cứ ${PER_STICKER} ⭐ là có 1 sticker mới. Con có ${S.stars} ⭐, còn ${PER_STICKER-S.stars%PER_STICKER} ⭐ nữa!`,'home')+`<div class="grid g3">${STICKERS.map((s,i)=>i<n?`<div class="stk got">${s}</div>`:`<div class="stk lock">?</div>`).join('')}</div>
  <div><h2>Các bạn của Bibi</h2><p class="sub">Chạm để nghe các bạn chào</p></div><div class="grid g3">${Object.keys(CAST).map(k=>`<button class="tile" style="background:var(--card);border:2px solid var(--line)" data-act="hi" data-arg="${k}"><span class="masc" style="width:74px">${mascot(k)}</span><small><b style="font-size:14px">${CAST[k]}</b></small></button>`).join('')}</div>`;}
A.hi=k=>{const j=JOKES.find(x=>x[0]===k);say(j[1]);toast(j[2]);};

window.__mascot=mascot;
chips();go('home');
})();
</script>
</body></html>
